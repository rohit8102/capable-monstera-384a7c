<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rohit Kumar | Futuristic Login</title>

<link href="avatar.png" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(rgba(0,0,0,0.65),rgba(0,0,0,0.75)),
    url('background.png');

    background-size:cover;
    background-position:center;
    position:relative;
}

/* Floating Flower Cursor */
.flower{
    position:absolute;
    width:20px;
    height:20px;
    pointer-events:none;
    background-image:url('https://cdn-icons-png.flaticon.com/512/616/616490.png');
    background-size:cover;
    animation:fall 4s linear forwards;
    z-index:999;
}

@keyframes fall{

    0%{
        transform:translateY(-10px) rotate(0deg);
        opacity:1;
    }

    100%{
        transform:translateY(100vh) rotate(360deg);
        opacity:0;
    }

}

/* Main Container */
.container{
    width:950px;
    height:580px;

    display:flex;

    border-radius:30px;

    overflow:hidden;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.1);

    backdrop-filter:blur(18px);

    box-shadow:
    0 0 30px rgba(0,0,0,0.5),
    0 0 60px rgba(214,51,255,0.2);
}

/* LEFT SIDE */
.left{
    width:50%;
    position:relative;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
}

/* Neon Aura */
.circle{
    position:absolute;

    width:420px;
    height:420px;

    border-radius:50%;

    background:
    radial-gradient(circle,
    rgba(214,51,255,0.3),
    transparent 70%);

    animation:rotate 10s linear infinite;
}

@keyframes rotate{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

/* Avatar */
.avatar{

    width:78%;
    z-index:10;

    filter:
    drop-shadow(0 0 20px #2196f3)
    drop-shadow(0 0 35px #d633ff);

    animation:
    float 4s ease-in-out infinite,
    glow 3s infinite alternate;

    transition:0.5s;
}

.avatar:hover{

    transform:
    scale(1.05)
    rotateY(8deg);

}

/* Floating */
@keyframes float{

    0%,100%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-20px);
    }

}

/* Glow */
@keyframes glow{

    0%{
        filter:
        drop-shadow(0 0 15px #2196f3)
        drop-shadow(0 0 25px #2196f3);
    }

    100%{
        filter:
        drop-shadow(0 0 25px #d633ff)
        drop-shadow(0 0 50px #d633ff);
    }

}

/* Particles */
.particle{
    position:absolute;

    width:12px;
    height:12px;

    border-radius:50%;

    background:#ff66ff;

    box-shadow:0 0 20px #ff66ff;

    animation:particleFloat 6s infinite ease-in-out;
}

.p1{
    top:20%;
    left:20%;
}

.p2{
    top:70%;
    left:25%;
    animation-delay:1s;
}

.p3{
    top:30%;
    right:20%;
    animation-delay:2s;
}

.p4{
    bottom:15%;
    right:25%;
    animation-delay:3s;
}

@keyframes particleFloat{

    0%{
        transform:translateY(0px) scale(1);
        opacity:1;
    }

    50%{
        transform:translateY(-30px) scale(1.5);
        opacity:0.6;
    }

    100%{
        transform:translateY(0px) scale(1);
        opacity:1;
    }

}

/* RIGHT SIDE */
.right{

    width:50%;

    padding:60px 50px;

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.lock{

    font-size:65px;
    text-align:center;
    margin-bottom:20px;
}

/* Heading */
.right h1{

    color:white;
    text-align:center;
    font-size:45px;
    line-height:1.2;
}

.right h1 span{

    background:linear-gradient(90deg,#2196f3,#d633ff);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.right p{

    color:#ccc;
    text-align:center;
    margin-top:10px;
    margin-bottom:35px;
}

/* Input */
.input-box{
    position:relative;
    margin-bottom:20px;
}

.input-box input{

    width:100%;

    padding:16px;

    border:none;
    outline:none;

    border-radius:14px;

    background:rgba(255,255,255,0.07);

    border:1px solid rgba(255,255,255,0.1);

    color:white;
    font-size:16px;
}

.input-box input::placeholder{
    color:#bbb;
}

/* Eye */
.eye{

    position:absolute;

    right:15px;
    top:16px;

    cursor:pointer;
    color:white;
}

/* Options */
.options{

    display:flex;
    justify-content:space-between;

    color:#ddd;

    margin-bottom:25px;

    font-size:14px;
}

.options a{

    color:#00aaff;
    text-decoration:none;
}

/* Button */
button{

    padding:16px;

    border:none;
    border-radius:14px;

    background:
    linear-gradient(90deg,#2196f3,#d633ff);

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:0.4s;
}

button:hover{

    transform:scale(1.03);

    box-shadow:
    0 0 20px #d633ff,
    0 0 40px #2196f3;
}

/* Bottom */
.bottom{

    text-align:center;

    margin-top:20px;

    color:#bbb;
}

.bottom a{

    color:#00aaff;
    text-decoration:none;
}

/* Mobile */
@media(max-width:900px){

    .container{

        width:95%;
        height:auto;

        flex-direction:column;
    }

    .left,.right{
        width:100%;
    }

    .avatar{
        width:70%;
    }

    .right{
        padding:40px 25px;
    }

    .right h1{
        font-size:35px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="left">

        <div class="circle"></div>

        <span class="particle p1"></span>
        <span class="particle p2"></span>
        <span class="particle p3"></span>
        <span class="particle p4"></span>

        <!-- YOUR AI AVATAR -->
        <img src="avatar.png" class="avatar">

    </div>

    <!-- RIGHT -->
    <div class="right">

        <div class="lock">🔒</div>

        <h1>
            Welcome Back,<br>
            <span>Rohit Kumar</span>
        </h1>

        <p>Login to access your futuristic portfolio dashboard</p>

        <!-- Username -->
        <div class="input-box">
            <input type="text" id="username" placeholder="Enter Username">
        </div>

        <!-- Password -->
        <div class="input-box">
            <input type="password" id="password" placeholder="Enter Password">

            <span class="eye" onclick="togglePassword()">👁️</span>
        </div>

        <!-- Options -->
        <div class="options">

            <label>
                <input type="checkbox">
                Remember Me
            </label>

            <a href="#">Forgot Password?</a>

        </div>

        <!-- Login -->
        <button onclick="login()">
            Login →
        </button>

        <div class="bottom">

            Not a member?
            <a href="#">Contact Admin</a>

        </div>

    </div>

</div>

<script>

/* FLOWER CURSOR */

document.addEventListener("mousemove",(e)=>{

    let flower=document.createElement("div");

    flower.className="flower";

    flower.style.left=e.pageX+"px";
    flower.style.top=e.pageY+"px";

    flower.style.animationDuration=Math.random()*3+2+"s";

    document.body.appendChild(flower);

    setTimeout(()=>{
        flower.remove();
    },5000);

});

/* SHOW PASSWORD */

function togglePassword(){

    let pass=document.getElementById("password");

    if(pass.type==="password"){

        pass.type="text";

    }

    else{

        pass.type="password";

    }

}

/* LOGIN SYSTEM */

function login(){

    let user=document.getElementById("username").value;

    let pass=document.getElementById("password").value;

    if(user==="admin" && pass==="1234"){

        localStorage.setItem("login","true");

        window.location.href="dashboard.html";

    }

    else{

        alert("Invalid Username or Password");

    }

}

</script>

</body>
</html>
