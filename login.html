<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rohit Kumar Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
  linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
  url('a_high_detail_polished_ui_login_page_design_with.png');
  background-size:cover;
  background-position:center;
}

/* Floating Flowers */
.flower{
  position:absolute;
  width:20px;
  height:20px;
  background:url('https://cdn-icons-png.flaticon.com/512/616/616490.png');
  background-size:cover;
  pointer-events:none;
  animation:fall linear forwards;
}

@keyframes fall{
  0%{
    transform:translateY(-10px) rotate(0deg);
    opacity:1;
  }

  100%{
    transform:translateY(100vh) rotate(360deg);
    opacity:0;
  }
}

/* Main Container */
.container{
  width:950px;
  height:550px;
  display:flex;
  border-radius:25px;
  overflow:hidden;
  backdrop-filter:blur(15px);
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  box-shadow:0 0 40px rgba(0,0,0,0.5);
}

/* LEFT SIDE */
.left{
  width:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.left img{
  width:90%;
  max-height:500px;
  object-fit:contain;
  animation:float 4s ease-in-out infinite;
}

@keyframes float{
  0%,100%{
    transform:translateY(0px);
  }

  50%{
    transform:translateY(-15px);
  }
}

/* RIGHT SIDE */
.right{
  width:50%;
  padding:60px 50px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.lock{
  font-size:60px;
  text-align:center;
  margin-bottom:20px;
}

.right h1{
  color:white;
  text-align:center;
  margin-bottom:10px;
}

.right h1 span{
  color:#b84dff;
}

.right p{
  text-align:center;
  color:#ccc;
  margin-bottom:30px;
}

/* Input */
.input-box{
  position:relative;
  margin-bottom:20px;
}

.input-box input{
  width:100%;
  padding:15px;
  border:none;
  outline:none;
  border-radius:12px;
  background:rgba(255,255,255,0.08);
  color:white;
  font-size:16px;
  border:1px solid rgba(255,255,255,0.1);
}

.input-box input::placeholder{
  color:#bbb;
}

/* Password Eye */
.eye{
  position:absolute;
  right:15px;
  top:15px;
  cursor:pointer;
  color:white;
}

/* Remember */
.options{
  display:flex;
  justify-content:space-between;
  color:white;
  font-size:14px;
  margin-bottom:25px;
}

/* Button */
button{
  padding:15px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#2196f3,#d633ff);
  color:white;
  font-size:18px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.03);
  box-shadow:0 0 20px #d633ff;
}

.bottom{
  text-align:center;
  margin-top:20px;
  color:#ccc;
}

.bottom a{
  color:#00aaff;
  text-decoration:none;
}

/* Responsive */
@media(max-width:900px){

  .container{
    width:95%;
    height:auto;
    flex-direction:column;
  }

  .left,.right{
    width:100%;
  }

  .left img{
    width:70%;
  }

}

</style>
</head>

<body>

<!-- FLOWERS -->
<script>

document.addEventListener("mousemove",(e)=>{

  let flower=document.createElement("div");
  flower.className="flower";

  flower.style.left=e.pageX+"px";
  flower.style.top=e.pageY+"px";

  flower.style.animationDuration=Math.random()*3+2+"s";

  document.body.appendChild(flower);

  setTimeout(()=>{
    flower.remove();
  },5000);

});

</script>

<div class="container">

  <!-- LEFT -->
  <div class="left">
    <img src="a_stylized_high_quality_3d_cgi_illustrated_portra.png">
  </div>

  <!-- RIGHT -->
  <div class="right">

    <div class="lock">🔒</div>

    <h1>Welcome Back,<br><span>Rohit Kumar</span></h1>

    <p>Login to access your portfolio dashboard</p>

    <div class="input-box">
      <input type="text" id="username" placeholder="Username">
    </div>

    <div class="input-box">
      <input type="password" id="password" placeholder="Password">
      <span class="eye" onclick="togglePassword()">👁️</span>
    </div>

    <div class="options">
      <label><input type="checkbox"> Remember Me</label>
      <a href="#" style="color:#00aaff;">Forgot Password?</a>
    </div>

    <button onclick="login()">Login →</button>

    <div class="bottom">
      Not a member?
      <a href="#">Contact Admin</a>
    </div>

  </div>

</div>

<script>

/* Show Password */
function togglePassword(){

  let pass=document.getElementById("password");

  if(pass.type==="password"){
    pass.type="text";
  }
  else{
    pass.type="password";
  }

}

/* Login System */

function login(){

  let user=document.getElementById("username").value;
  let pass=document.getElementById("password").value;

  if(user==="admin" && pass==="1234"){

    localStorage.setItem("login","true");

    window.location.href="dashboard.html";

  }

  else{
    alert("Invalid Username or Password");
  }

}

</script>

</body>
</html>
